name: prove
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unc:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove sandbox path behavior without a kernel prefix
        run: node scripts/prove-unc.js
      - name: Prove drive classification and Windows SUBST refusal
        run: node scripts/prove-windows-drives.js
      - name: Prove privilege patch boundaries
        run: node scripts/prove-privilege-patches.js
      - name: Prove Linux CIFS refusal at command confinement
        run: node scripts/prove-linux-cifs.js
      - name: Prove real Windows junction creation through the runtime shim
        if: runner.os == 'Windows'
        run: node scripts/prove-junction.js
      - name: Install ripgrep for the real Linux search proof
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # The Chocolatey community feed sometimes answers nothing and choco still
      # exits 0 with "installed 0/0", so the search proof then dies on a missing
      # rg. Take Microsoft's packaged rg from npm first, choco only as fallback,
      # and fail here if neither produced a working rg.
      - name: Install ripgrep for the real Windows search proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'rg'
          npm install --no-save --no-fund --no-audit --prefix $dir '@vscode/ripgrep'
          $bin = Join-Path $dir 'node_modules\@vscode\ripgrep\bin'
          if (Test-Path (Join-Path $bin 'rg.exe')) {
            Add-Content -Path $env:GITHUB_PATH -Value $bin
            & (Join-Path $bin 'rg.exe') --version
          } else {
            choco install ripgrep --yes --no-progress
            rg --version
            if ($LASTEXITCODE -ne 0) { throw 'ripgrep-missing' }
          }
      - name: Prove missing-root fallback preserves real search errors
        run: node scripts/prove-search-errors.js
      - name: Prove local OAuth credential recording and custom endpoints
        run: node scripts/prove-models.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python readers for old Office files (the server's venv has the same pins)
        run: python -m pip install --disable-pip-version-check olefile==0.47 xlrd==2.0.1
      - name: Prove knowledge search (who sees what, ranking, PDF, OCR queue, old Office files)
        run: node scripts/prove-knowledge.js
        env:
          PROVE_PY: python
      - name: Prove the model gateway answers only a live login token
        run: node scripts/prove-gw-auth.js
      - name: Prove the TLS gateway switch and the /fetch guard
        run: node scripts/prove-gw-tls.js
      - name: Prove the company-share rights (throwaway accounts; fails if the share opens again)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\prove-secure-folders-ci.ps1
      - name: Prove the company-tailnet join logic (facts, on-tailnet check, never rejoin)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\prove-tailnet-join.ps1
      - name: Prove the desk mounts the share with its own account over a stale connection (throwaway accounts)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\prove-share-mount.ps1
      - name: Prove the desk heals a company model route its own config broke (NO_ADAPTER)
        run: node scripts/prove-model-heal.js
      - name: Prove the region-edit canvas (crop geometry, tone, both doors against a stand-in gateway)
        run: node scripts/prove-region-edit.js
      - name: Prove the desk source (parses, nothing of one company, site patches apply, overlay)
        run: python scripts/prove-desk-source.py
      - name: Desk lease selftest (one desk per person, conversations move with them; zstd logs, copies)
        working-directory: desk/pack/common
        run: node desk-lease.js selftest
      - name: Prove knowledge-search recall (right page first, off-topic refused, synonyms)
        run: node scripts/prove-kb-recall.js
      - name: Prove people management, including removing an account for good
        if: runner.os == 'Linux'
        run: python3 scripts/prove-people.py
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Version, release notes and front page move together
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/prove-release-notes.js
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and publish this version with its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$v" >/dev/null 2>&1; then echo "RELEASE_EXISTS=v$v"; exit 0; fi
          awk -v v="$v" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "TDHarness $v" --notes-file notes.md
          echo "RELEASED=v$v"
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Every workflow file parses (a broken one never runs and only shows a red X on push)
        run: python3 -c "import glob,yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('WORKFLOWS_PARSE_OK=1')"
      - name: Office-fingerprint and tracked-secret scan
        run: bash scripts/prove-scan.sh
      - name: Prove the scan rejects synthetic secrets and every office needle
        run: node scripts/prove-secret-scan.js
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dsh into a throwaway prefix
        run: |
          PIN="$(awk -F': ' '/^id:/{gsub(/[" ]/, "", $2); print $2; exit}' kernel.yml)"
          npm install -g "@deepseek-ai/dsh@${PIN}" --prefix "$HOME/tdh-gold"
      - name: Apply onto a copy and check marks
        run: KERNEL_PREFIX="$HOME/tdh-gold" node scripts/prove-patches.js
